appId: app.llmbench.desktop
productName: LLM Bench
copyright: Copyright © 2026 LLM Bench
directories:
  output: dist
  buildResources: build

# Everything is bundled by scripts/build.mjs, so the package needs no node_modules.
files:
  - out/**/*
  - '!out/**/*.map'
  - package.json
extraResources:
  - from: resources
    to: app-resources
    filter:
      - '**/*'
asar: true
compression: normal

# Hardening for the shipped app. (E2E runs on the unpackaged build, which keeps the defaults.)
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableCookieEncryption: true
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: resources/icons/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: LLM Bench
  installerLanguages: [it_IT, en_US]
  language: '1040'
  displayLanguageSelector: true
  artifactName: LLM-Bench-Setup-${version}.${ext}
  uninstallDisplayName: LLM Bench

portable:
  artifactName: LLM-Bench-${version}-portable.${ext}

linux:
  target:
    - target: deb
      arch: [x64]
    - target: AppImage
      arch: [x64]
  icon: resources/icons/icon.png
  category: Utility
  synopsis: Misura le prestazioni della GPU con l'inferenza LLM
  description: LLM Bench misura caricamento a freddo e a caldo, token/s, latenza, VRAM e consumi con llama.cpp, vLLM, SGLang e NInfer.
  maintainer: LLM Bench <noreply@llmbench.invalid>
  # llm-bench-<version>-amd64.deb, llm-bench-<version>-x86_64.AppImage
  artifactName: llm-bench-${version}-${arch}.${ext}
  # Lets the desktop link the running window to llm-bench.desktop (app_id / WM_CLASS).
  syncDesktopName: true
  desktop:
    entry:
      Name: LLM Bench
      StartupWMClass: llm-bench

deb:
  priority: optional
  # electron-builder's defaults plus what a minimal Ubuntu 24.04 lacks (found by the clean-distro
  # test): ALSA for Electron itself and OpenMP for the llama.cpp Linux builds the app installs
  # (libgomp.so.1). ALSA names the real package first: on 24.04 a bare "libasound2" is virtual and
  # apt may pick liboss4-salsa-asound2, a stub Electron cannot load (undefined snd_* symbols).
  depends: [libgtk-3-0, libnotify4, libnss3, libxss1, libxtst6, xdg-utils, libatspi2.0-0, libuuid1, libsecret-1-0, 'libasound2t64 | libasound2', libgomp1]
